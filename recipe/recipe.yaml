schema_version: 1

context:
  version: "42.0.1"

package:
  name: gherkin-official
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gherkin-official/gherkin_official-${{ version }}.tar.gz
  sha256: adcc1f392d97dc044861bb645a614e335632330cc2653d23acb7097c923f75cd

build:
  number: 0
  noarch: python
  script:
    # py2-only module with syntax that fails to byte-compile under py3
    - rm gherkin/count_symbols_py2.py
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - gherkin
        - gherkin.parser
        - gherkin.errors
      pip_check: true
      python_version: ["${{ python_min }}.*", "*"]

about:
  homepage: https://github.com/cucumber/gherkin
  license: MIT
  license_file: LICENSE
  summary: Gherkin parser/compiler for Python
  repository: https://github.com/cucumber/gherkin

extra:
  recipe-maintainers:
    - mariusvniekerk
    - killua156
